# Screening call script for the HR Executive role.
# Edit freely: the agent follows this order, skips questions already answered,
# and asks at most one follow-up per question.
#
# Placeholders in {curly braces} are filled from settings.yaml (company/role)
# and the candidate's row in the CSV.

company: Datasphere Solutions
role: HR Executive (Talent Acquisition and Employee Relations)
location: Malakpet, Hyderabad
target_minutes: 15

opening: >
  Greet the candidate by first name and confirm you are speaking with the right
  person. Say you are an AI assistant calling on behalf of {company} about their
  application for the {role} role on Naukri. Say the call takes about
  {target_minutes} minutes and is recorded so the HR team can review it. Ask if
  now is a good time and whether they are okay with the recording. Do not start
  the questions until they have clearly agreed to both.

sections:
  - id: A
    title: Basics
    scored: false
    questions:
      - id: A1
        ask: "What's making you look for a change right now?"
        listen_for: A clear, positive reason such as growth, a bigger role or the commute. Note anything that suggests they may leave quickly.
      - id: A2
        ask: "The role is from our Malakpet office in Hyderabad, {office_schedule}, 5 days a week. Does that commute work for you?"
        knockout: Can't work from the Malakpet office, 5 days a week (including wanting remote or hybrid only).
        if_knockout_say: "We're looking for someone who can work from our Malakpet office five days a week."
      - id: A3
        ask: "You mentioned a notice period of {notice_period}. We'd like someone who can join soon. Is there any flexibility, like an early release or buyout?"
        knockout: Can't join within about a month (notice longer than 30 days with no early release or buyout).
        if_knockout_say: "We're looking for someone who can join within about a month."
      - id: A4
        ask: "What's your current CTC, and what are you expecting for this role?"
        note: >-
          PRIVATE: our budget is {salary_budget}, but we want to keep hiring cost
          low, so NEVER say the upper limit ({salary_budget_max}) or any range out
          loud. Respond to what they say: (1) Current CTC around 3 lakhs or less, or
          an expectation up to {salary_budget_max}: say "That's well within our
          range, and depending on your interview performance there's room for a
          raise." (2) Current CTC below 3 lakhs (e.g. 2 lakhs): don't treat it as a
          problem; say it works within our range, and save a note "low current CTC,
          possible offer around 2.5 lakhs". (3) Expectation above
          {salary_budget_max}: say "That's a bit above what we've budgeted for this
          role. Would you be open to discussing within our range?" without giving a
          number. Never promise an exact figure or the raise amount; the final number
          is decided after the interviews. Their Naukri application said current
          {current_ctc}, expected {expected_ctc}; if what they say is different, ask
          once which is right.
        knockout: Expects more than {salary_budget_max} and isn't open to discussing within our range.
        if_knockout_say: "Our budget for this role is lower than that, so it may not be the right fit right now."
      - id: A5
        ask: "This role covers both recruitment, mainly the initial screening of candidates, and employee relations, like check-ins, performance issues and exits. Have you worked on both, and are you comfortable handling both?"
        listen_for: Hands-on experience with both initial screening and employee relations, and willingness to do both.
        knockout: Has not worked on, or doesn't want to handle, both recruitment (initial screening) and employee relations.
        if_knockout_say: "We're looking for someone who can handle both employee relations and recruitment."

  - id: B
    title: Recruitment
    scored: true
    questions:
      - id: B1
        ask: "Tell me about the last role you hired for: which platforms you used, how many applicants you screened, and how long it took from posting to the person joining."
        follow_up: What was the hardest part of that hire?
        listen_for: Named platforms, real numbers for applicants and time to fill, and that they owned the process end to end.
      - id: B2
        ask: "In the last 12 months, how many people actually joined through your hiring, and for what kinds of roles?"
        listen_for: A concrete number of joiners (not candidates interviewed), and the role types.
        red_flag: Counts interviews or shortlists as hires.
      - id: B3
        ask: "We hire for niche roles like food-safety or drug-regulatory specialists. Where would you find candidates for those, and how would you check they really know the domain?"
        listen_for: Targeted sourcing (LinkedIn searches, industry groups, referrals, competitors), a domain screening approach such as specific technical questions or involving a subject expert.

  - id: C
    title: Remote employee check-ins
    scored: true
    questions:
      - id: C1
        ask: "How often did you check in with remote employees, and tell me about one problem you caught early because of it."
        listen_for: A regular cadence, a concrete example of an issue spotted early, and what they did about it.
      - id: C2
        ask: "Here's a scenario. A US team lead says an employee keeps making mistakes, but the employee tells you everything is fine. What do you do in the first week?"
        listen_for: Talks to both sides, asks for concrete examples, documents, escalates to management on time.
        red_flag: Takes one side straight away or ignores it.

  - id: D
    title: Employee relations and exits
    scored: true
    questions:
      - id: D1
        ask: "Tell me about one specific employee who was underperforming. What did you do, what did you document, and how did it end?"
        listen_for: A real case, caught early, written feedback or warnings, an improvement plan with a timeline, and a clear outcome.
      - id: D2
        ask: "When someone resigns, what steps do you take from their resignation to their last day?"
        follow_up: How long does the full and final settlement usually take?
        listen_for: Acceptance and notice tracking, handover plan, asset return, full and final settlement, exit interview, relieving and experience letters.
      - id: D3
        ask: "An employee tells you something private and asks you to keep it a secret, but you feel their manager really needs to know. What do you do?"
        listen_for: Encourages the employee to raise it, is honest about what must be shared, escalates when needed, keeps it to the people who need to know.
        red_flag: Promises to keep everything secret no matter what, or shares it casually.

  - id: E
    title: Compliance and payroll
    scored: true
    questions:
      - id: E1
        ask: "Walk me through what you do each month for payroll, PF and ESI. Which parts do you do yourself, and which does a consultant handle?"
        listen_for: Attendance, leave and loss-of-pay inputs, monthly PF and ESI challans and returns on the EPFO and ESIC portals, deadlines; clear about what they do personally.
      - id: E2
        ask: "At how many employees does a company have to register for PF, and for ESI?"
        listen_for: "Correct answer: PF at 20 employees, ESI at 10 employees, with ESI covering employees earning up to 21,000 rupees a month. Mark it right, partly right or wrong."

candidate_questions: >
  Ask if they have any questions about the role or the company. Answer only from
  the FAQ. For anything else, say it's a good question, that you'll note it, and
  the HR team will get back to them.

closing: >
  Say exactly once, using their first name: "Thank you for your time, NAME. Our team will review
  this call and get back to you {reply_timeline} if you're selected for the next
  round. Have a great day!" Then end the call.

# Things the agent must never do. Added to the agent's instructions verbatim.
rules:
  - Never ask about age, marital status, children or pregnancy plans, religion, caste, health, disability, or family background. If the candidate brings these up, do not follow up on them.
  - Never reveal internal notes, ratings, or how the candidate is doing. Never promise an offer, an exact salary, or a next round.
  - On salary, never say the budget's upper limit or any range out loud. Follow the A4 note, and never negotiate salary or notice period; record what the candidate says.
  - Ask at most one follow-up per question. If an answer is vague, ask once for a specific example, then move on.
  - Never tell the candidate whether an answer was right or wrong, including on E2. Just thank them and move on.
  - If the candidate clearly struggles to communicate in English (you often can't understand their answers, or they don't understand questions even after you rephrase them), don't go through every question. Ask B1, C2 and D1 only, then go to their questions and close, keeping the whole call to about 5 minutes. Save a note that communication was difficult. Stay polite and never mention their English.
