# Answers the agent may give when the candidate asks something.
# The agent answers ONLY from this list. Anything else is noted for the HR team.
#
# Any answer that starts with "TODO" is ignored (the agent will say the HR team
# will follow up). Replace the TODOs with real answers before calling.

faq:
  - topic: About the company
    answer: >-
      Datasphere Solutions is a Hyderabad-based team that provides offshore
      regulatory compliance support, mainly for US companies. We've been working
      with Registrar Corp, helping with their compliance work from India. We
      recently became a private limited company, and we're now growing the team
      and looking to take on more clients in the regulatory space. So it's a
      small, focused team where your work directly affects how clients see us.

  - topic: Roles and responsibilities
    answer: >-
      (Summarise in two or three sentences; give more detail only if they ask.)
      Talent acquisition: managing recruitment end to end, from job posting to
      onboarding, mainly the initial screening of candidates; building a pipeline
      for recurring roles; interviewing and recommending hires; and setting clear
      30, 60 and 90 day expectations for new hires. Remote team check-ins:
      regular one-on-ones with every remote employee (weekly in their first month,
      then every two weeks or monthly) about how work is going, what's blocking
      them and how things are with the US team; monthly check-ins with the US team
      leads; keeping short notes and flagging concerns to management within 48
      hours. Employee relations: being the first point of contact for concerns,
      conflicts and grievances; tracking probation and running reviews with
      documented feedback; handling exits properly, including notice, handover,
      exit interviews and settlements. HR operations and compliance: employee
      records, leave, attendance and payroll inputs; PF, ESI and professional tax
      filings; and keeping contracts, NDAs and the employee handbook up to date.

  - topic: What we look for
    answer: >-
      Two to four years of HR experience with recruitment exposure, ideally with
      remote teams; knowledge of Indian labour law and payroll basics; and someone
      who communicates well and is comfortable with honest conversations and
      confidential information.

  - topic: Who the role reports to
    answer: That will be discussed in the next round of interviews.

  - topic: Company size
    answer: We're a team of about 50 to 100 people.

  - topic: Permanent or contract
    answer: It's a permanent role.

  - topic: Branches
    answer: We have one office worldwide, and it's here in Hyderabad.

  - topic: Office location
    answer: The office is in Malakpet, Hyderabad. This is a work-from-office role.

  - topic: Office hours
    answer: Office hours are 9 am to 5 pm.

  - topic: Working days
    answer: It's 5 days a week.

  - topic: Salary / CTC
    answer: >-
      It depends on your experience and how the interviews go. The HR team will
      discuss the exact figure with you in the next round. (Never give a number
      or range.)

  - topic: Interview process
    answer: This screening call is the first step. After that there are one or two rounds of interviews.

  - topic: Probation period
    answer: The probation period is 3 months.

  - topic: Benefits
    answer: The package is the salary, and PF and medical insurance are included.

  - topic: Expected joining date
    answer: We'd like the person to join immediately if possible.

  - topic: When they will hear back
    answer: The HR team will get back within 3 working days.

  - topic: Whether this is a real person
    answer: I'm an AI assistant. A person from the HR team reviews every call and makes all decisions.
