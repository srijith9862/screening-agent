# Runtime settings. API keys do NOT go here: put them in .env (see .env.example).

agent_name: Priya

# Values used to fill {placeholders} in script.yaml.
script_values:
  office_schedule: 9 am to 5 pm
  salary_budget: 3 to 5 lakhs per annum
  salary_budget_max: 5 lakhs per annum
  reply_timeline: within 3 working days

claude:
  # Live conversation: Claude Haiku 5.5, the cheapest and fastest model, with
  # thinking off. For more careful (and ~20-40x pricier) replies use
  # claude-sonnet-5-5 or claude-opus-5-5, and set live_thinking: true.
  live_model: claude-haiku-5-5
  live_effort: low
  live_thinking: false
  # Scorecard after the call (one request per candidate). Haiku keeps bulk
  # calling cheap; use claude-sonnet-5-5 for more careful scorecards.
  score_model: claude-haiku-5-5
  score_effort: medium

deepgram:
  stt_model: nova-3
  stt_language: en-IN        # Indian English. Use "en" if en-IN gives errors.
  tts_voice: flux-priya-en   # Indian English, female. Also: flux-meena-en (female), flux-naveen-en (male)
  # -2 calm ... 0 default ... 2 animated (Flux voices only, beta). Higher values
  # sound livelier but can occasionally drop or repeat words. Try with voice-test.
  tts_expressivity: 1
  endpointing_ms: 400        # silence before Deepgram marks speech as finished
  utterance_end_ms: 1200     # longer gap that always ends the candidate's turn

audio:
  # Substring of the Windows device names. Run `python -m screener devices`
  # to see the exact names on your laptop.
  call_in_device: "CABLE Output"     # what the candidate says (Phone Link plays into "CABLE Input")
  call_out_device: "Hi-Fi Cable Input"   # what the agent says (Phone Link's mic is "Hi-Fi Cable Output")

phone:
  adb_path: adb              # or full path, e.g. C:\platform-tools\adb.exe
  device_serial: null        # set if more than one Android device is connected
  default_country_code: "+91"
  # "telecom": wait until Android reports the call as ACTIVE (most reliable).
  # "speech": wait until the candidate says something (use if telecom detection fails).
  answer_detection: telecom
  ring_timeout_s: 45
  # "phonelink": dial from the laptop through Phone Link (call audio starts on
  # the laptop). "adb": dial on the phone (may need a switch to Bluetooth).
  dial_via: phonelink
  # Calls dialed on the phone can stay on its earpiece. When true, the agent
  # taps the in-call "Bluetooth" button if no call audio reaches the laptop
  # (it never taps when the button already shows Bluetooth as on).
  auto_bluetooth: true
  # The laptop's Bluetooth name, used only if the phone shows a device list.
  bluetooth_device_name: "Srijith9862"

call:
  max_minutes: 20            # hard stop
  wrap_up_minute: 17         # agent is told to start wrapping up
  greeting_delay_s: 2        # pause after pickup before "Hello, am I speaking with ...?"
  thinking_wait_s: 4         # after "umm"/"hmm"/"let me think", wait this long before replying
  trailing_off_wait_s: 1.5   # extra wait when an answer ends mid-sentence ("...and", "...because")
  silence_timeout_s: 10      # nudge the candidate after this much silence
  max_silences: 2            # end the call after this many nudges in a row
  gap_between_calls_s: 90    # pause between calls (helps avoid spam flagging)
  confirm_before_each_call: true
  calling_hours: "10:00-21:30"   # IST; no new calls start outside this window
  timezone: Asia/Kolkata

storage:
  output_dir: output
  retention_days: 90         # `python -m screener purge` deletes older recordings
